[mimir]
# GitHub owner/repo, HTTPS/SSH URL, or local Git remote.
remote = "mimir/mimir"
ref = "master"
variant = "tensor-llvm"
# linear (frozen W): "kn" passes W[K,N] as-is; "nk" transposes it once outside timing.
linear_weight_layout = "kn"
plugins = ["opt", "ll"]
compiler_flags = []
cmake = "cmake"
cmake_flags = []
jobs = 4
clangxx = "clang++"
compile_flags = ["-O3", "-std=c++20", "-shared", "-fPIC", "-Wno-override-module"]
# Match benchmark.mcpu; generic uses the compiler's default target.
target_flags = ["auto"] # -mcpu=<cpu> on ARM, -march=<cpu> on x86; generic adds neither.
