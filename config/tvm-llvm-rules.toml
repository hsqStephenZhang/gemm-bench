# Short GEMM experiment with explicit ms.ScheduleRule.create("llvm").
[tvm]
schedule = "dlight"
[tvm.auto_tune]
enabled = true
schedule_rules = "llvm"
trials = 64
num_trials_per_iter = 16
builder_workers = 4
# Separate from the concurrently running long experiment's measurement/build CPUs.
builder_cpus = [12, 13, 14, 15]
number = 1
repeat = 3
min_repeat_ms = 20
