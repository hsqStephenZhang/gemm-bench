[pytorch]
mode = "inductor" # eager or inductor; the paired baseline always stays eager
# Native eager ATen: mm.out, mv.out, convolution (no bias, groups=1, dilation=1).
variant = "eager-native"
intraop_threads = 1
interop_threads = 1
compiler = "c++"
compile_flags = ["-O3", "-shared", "-fPIC", "-std=c++20"]

[pytorch.inductor]
# Default Inductor CPU compilation, without max-autotune.
max_autotune = false
compile_threads = 1
