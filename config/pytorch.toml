[pytorch]
# Native eager ATen: mm.out, mv.out, convolution (no bias, groups=1, dilation=1).
variant = "eager-native"
interop_threads = 1
compiler = "c++"
compile_flags = ["-O3", "-shared", "-fPIC", "-std=c++20"]
# macOS only: "accelerate" keeps the wheel's Accelerate BLAS (uses the AMX coprocessor);
# "openblas" interposes sgemm_/sgemv_/... to OpenBLAS so only NEON CPU cores compute.
macos_blas = "openblas"
