[iree]
variant = "data-tiling-late-materialization"
backend = "llvm-cpu"
driver = "local-sync"
compiler_flags = ["--iree-opt-data-tiling=true", "--iree-llvmcpu-enable-ukernels=all", "--iree-global-opt-enable-early-materialization=false"]
# local-sync invokes kernels on the calling thread, without task workers.
benchmark_flags = []
dump_ir = true
