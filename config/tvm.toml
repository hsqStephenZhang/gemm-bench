[tvm]
schedule = "llvm" # llvm (first candidate, no search/mutation), dlight or naive
# auto_tune overrides schedule when enabled
# apache-tvm and its bundled compiler are installed via uv.

[tvm.auto_tune]
schedule_rules = "from-target" # or llvm for explicit generic CPU rules
enabled = false
trials = 64
num_trials_per_iter = 16
builder_workers = 4
# Empty: use allowed CPUs other than the measurement CPU, or that CPU if it is the only one.
# Explicit lists must be within the process's original allowed CPU set.
builder_cpus = []
number = 1
repeat = 3
min_repeat_ms = 20
