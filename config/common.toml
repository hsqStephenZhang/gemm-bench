# All paths are relative to the gemm-bench project root.
[benchmark]
device = "cpu"
# Omit cpu to select the lowest CPU allowed by the process affinity.
# cpu = 0  # Optional explicit pin; unavailable CPUs produce a clear error.
mcpu = "native" # Resolved once to the host LLVM CPU name (apple-m2, znver3, ...) for every backend.
seed = 42
dtype = "float32"
ops = ["gemm", "gemv", "conv2d"]
cases_files = ["config/gemm_cases.txt", "config/gemv_cases.txt", "config/conv2d_cases.txt", "config/linear_cases.txt"]
# linear (frozen-weight GEMM) runs with --ops linear or --ops all.
default_reps = 1
output_root = "results"
parallel = false
repeats = 9
min_repeat_ms = 100
warmup = 5
rtol = 0.001
atol = 0.001

# Optional per-runner pins; omitted entries use benchmark.cpu or the lowest allowed CPU.
[runner_cpus]
# pytorch = 0
# tvm = 2
# iree = 4
# openblas = 6
# mimir = 8
# mimir-par = 10

[build]
# Persistent compiler checkouts and incremental builds.
directory = "build"

# Optional implementations; PyTorch always runs as the baseline.
[backends]
tvm = true
iree = true
openblas = true
mimir = true
# MimIR fork with blocked/packed contractions; same adapter as mimir.
mimir-par = true

[openblas]
library = "auto" # Linux libopenblas.so; macOS Homebrew libopenblas.dylib.
compiler = "cc"
compile_flags = ["-O3", "-shared", "-fPIC"]
link_flags = ["-lopenblas"]

[threads]
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
TVM_NUM_THREADS = "1"
# Keep the harness CPU pin; TVM must not rebind worker 0 to CPU 0.
TVM_BIND_THREADS = "0"
# MimIR runtime thread pool (mem.par_for); defaults to all performance cores.
MIM_NUM_THREADS = "1"

[artifacts]
# CLI --dump / --no-dump override this setting.
enabled = false
subdirectory = "artifacts"
objdump = "objdump"
